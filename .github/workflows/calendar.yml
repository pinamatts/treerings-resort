name: Sync booked dates
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the calendar feed
        env:
          AIRBNB_ICAL: ${{ secrets.AIRBNB_ICAL }} ${{ secrets.BOOKING_ICAL }}
        run: python3 .github/sync_calendar.py
      - name: Publish if the dates changed
        run: |
          git config user.name "calendar-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add booked.json 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "Update booked dates"; git push; }
